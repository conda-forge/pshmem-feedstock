{% set version = "1.3.5" %}

package:
  name: pshmem
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pshmem/pshmem-{{ version }}.tar.gz
  sha256: 564b10ee25f7e141c926c78fe0d028778458e925ae60928c09b5ac168b857d44

build:
  noarch: python
  number: 0
  script_env: SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - python-build
    - setuptools
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - numpy

test:
  requires:
    - python {{ python_min }}
  imports:
    - pshmem

about:
  home: https://github.com/tskisner/pshmem
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Parallel shared memory and locking with MPI
  description: |
    This is a small package that implements parallel design patterns using MPI
    one-sided and shared memory constructs.
  doc_url: https://github.com/tskisner/pshmem/README.md
  dev_url: https://github.com/tskisner/pshmem

extra:
  recipe-maintainers:
    - tskisner
